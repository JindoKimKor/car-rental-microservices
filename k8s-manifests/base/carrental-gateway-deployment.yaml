apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: carrental-gateway
  name: carrental-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: carrental-gateway
  template:
    metadata:
      labels:
        io.kompose.service: carrental-gateway
    spec:
      containers:
        - env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Docker
            - name: ASPNETCORE_URLS
              value: http://+:8080
          image: carrentalgateway
          name: carrental-gateway
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
