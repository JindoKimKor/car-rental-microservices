services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - appnetwork

  db-init-inventory:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    command: /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "YourStrong!Passw0rd" -i /scripts/init-inventory.sql
    networks:
      - appnetwork

  db-init-customer:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    command: /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "YourStrong!Passw0rd" -i /scripts/init-customer.sql
    networks:
      - appnetwork

  customer-webapi:
    depends_on:
      db-init-customer:
        condition: service_completed_successfully

  jk-inventory-webapi:
    depends_on:
      db-init-inventory:
        condition: service_completed_successfully
